[build-system]
# >=77: `license = "Apache-2.0"` is PEP 639 SPDX metadata, which
# setuptools only accepts in project.license from 77.0.0 on.
requires = ["setuptools>=77", "wheel", "Cython>=3.2.9"]
build-backend = "setuptools.build_meta"

[project]
name = "unimath"
version = "0.1.0"
description = "Python binding for the UniMath C library"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "lbartoletti" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["unimath"]