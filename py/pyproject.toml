[build-system]
# >=77: `license = "Apache-2.0"` is PEP 639 SPDX metadata, which
# setuptools only accepts in project.license from 77.0.0 on.
requires = ["setuptools>=77", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lituus-unimath"
version = "1.1.0"
description = "Multi-precision integers, fixed-point, big floats, rationals, intervals, and mathematical functions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "lbartoletti" }]
keywords = [
  "arbitrary-precision",
  "bigint",
  "bigfloat",
  "fixed-point",
  "rational",
  "interval-arithmetic",
  "numerical",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lituus-lab/UniMath"
Documentation = "https://lituus-lab.github.io/UniMath/"
Repository = "https://github.com/lituus-lab/UniMath"
Issues = "https://github.com/lituus-lab/UniMath/issues"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools]
packages = ["unimath"]
