# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (arithmetic ->
# arithmetic.nim) or a directory (arithmetic -> arithmetic/*.nim). Modules under
# no listed layer are unconstrained: the umbrella module re-exports everything.
[layers]
arithmetic
fixed
float
rational
interval
eft
roots
exponential
trigonometry
hyperbolic
special
constants
reduction
float_math
rational_math
conversions
math_router
c_api

# Similarly-prefixed packages this repo may name in `requires` (ADR-0001).
# Declared today: UniAccurate. Adding another name is a deliberate, reviewed
# exception, not a default.
[engines]
UniAccurate