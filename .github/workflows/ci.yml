name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the one job that needs more declares it itself.
permissions:
  contents: read

defaults:
  run:
    # bash on every runner, Windows included: one spelling for the gate call,
    # whose executable is named differently there.
    shell: bash

# A newer push makes the previous run's answer irrelevant: cancel it rather
# than pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Every commit must carry a Signed-off-by trailer
        run: |
          set -e
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          bad=0
          for c in $(git rev-list --no-merges "$range"); do
            # Parse the trailer block first, as tools/hooks/dco_check.sh does:
            # a bare grep also accepts a Signed-off-by quoted in the body.
            if ! git log -1 --format='%B' "$c" | git interpret-trailers --parse |
                 grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "Missing Signed-off-by on commit $c"
              git log -1 --oneline "$c"
              bad=1
            fi
          done
          exit $bad

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      # Mirrors tools/hooks/spdx_check.sh: every tracked Nim/C/Python source must
      # carry an SPDX-License-Identifier header in its first 5 lines.
      - name: Every Nim/C/Python source carries an SPDX header
        run: bash tools/hooks/spdx_check.sh

  test:
    name: Nim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - run: $GATE testCi
      - run: $GATE testCiRelease
      # The example demos are part of the documented surface but no test
      # pulled them in; build and run them so a broken example fails CI.
      - run: $GATE example

  cabi:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      # gcc arrives with Nim's MinGW, GNU make does not ship on the runner image.
      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: $GATE ctest
      # The C demo is part of the documented surface; nothing else builds it.
      - run: $GATE cexample
      # nimble ctest only builds the static lib (clibStatic); the shared lib
      # this job uploads below needs its own explicit build step.
      - run: $GATE clib
      - name: Upload Library
        uses: actions/upload-artifact@v7
        with:
          name: libUniMath-${{ matrix.os }}
          # The header ships with the lib: a C ABI artifact without it is not
          # consumable. Paths stay repo-relative so the zip keeps include/ intact.
          path: |
            include/UniMath.h
            libUniMath.so
            libUniMath.dll
            libUniMath.dylib
            libUniMath.a
            libUniMath.lib
  python:
    name: Python (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every version release.yml ships a wheel for: without Py_LIMITED_API
        # each CPython minor has its own C ABI, so each needs its own run.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -U setuptools wheel Cython pytest
      # CPython is MSVC-built here, so the lib it links must be too: put cl.exe on
      # PATH for `nimble pyLib`, which routes to clibMsvc on Windows.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: $GATE pyLib
      # `python3` isn't guaranteed on a Windows runner (actions/setup-python
      # only puts `python.exe` on PATH there); this job's matrix spans
      # windows-latest.
      - run: cd py && python setup.py build_ext --inplace
      - run: cd py && python -m pytest -q
      - run: cd py && python setup.py bdist_wheel
      - name: Repair Wheel (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install auditwheel
          auditwheel repair py/dist/*.whl -w py/dist/repaired/
      - name: Repair Wheel (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pip install delocate
          delocate-wheel py/dist/*.whl -w py/dist/repaired/
      - name: Repair Wheel (Windows)
        if: matrix.os == 'windows-latest'
        # bash, not the default PowerShell: pwsh does not expand
        # py/dist/*.whl, so delvewheel would receive the pattern itself.
        shell: bash
        run: |
          pip install delvewheel
          delvewheel repair py/dist/*.whl -w py/dist/repaired/
      - name: Upload Python Wheel
        uses: actions/upload-artifact@v7
        with:
          name: unimath-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: py/dist/repaired/*.whl

  consume-cabi:
    name: Consume C artifact (${{ matrix.os }})
    needs: cabi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # No setup-nim-action on purpose: proves the published header and lib work
      # on a machine without Nim, using only the test source from the checkout.
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          name: libUniMath-${{ matrix.os }}
          path: artifact
      - name: Compile and run a consumer against the artifact
        shell: bash
        run: |
          set -eu
          # Assert the shipped layout first: a missing piece names itself here,
          # rather than surfacing as an obscure compiler error.
          test -f artifact/include/UniMath.h
          test -f artifact/libUniMath.a
          CC=cc; BIN=consumer
          if [ "$RUNNER_OS" = Windows ]; then CC=gcc; BIN=consumer.exe; fi
          # -lm after the archive, as tests/c/Makefile does: the static lib
          # leaves libm calls (pow, sin, log, ...) unresolved for the final
          # link, and ld only scans a library for symbols already pending.
          "$CC" -Iartifact/include -O2 -Wall -Wextra -std=c11 -o "$BIN" \
            tests/c/test_unimath.c artifact/libUniMath.a -lm
          "./$BIN"

  consume-wheel:
    name: Consume wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Mirrors the python job: a wheel only installs on the CPython minor
        # it was built for, so each one is consumed where it was produced.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      # Neither Nim nor libUniMath exists here: whatever the extension needs
      # at runtime must have travelled inside the wheel.
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: unimath-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist
      - name: Install the wheel and test the installed package
        shell: bash
        run: |
          set -eu
          python -m pip install -U pip pytest
          # --only-binary rules out a silent fallback to building from source.
          python -m pip install --only-binary :all: dist/*.whl
          # Run outside the checkout so `import unimath` can only resolve to
          # the installed wheel, never to py/unimath next door.
          work="$RUNNER_TEMP/wheel-check"
          mkdir -p "$work"
          cp py/tests/test_smoke.py "$work/"
          cd "$work"
          python -m pytest -q
      - name: Execute the quickstart notebook against the installed wheel
        shell: bash
        run: |
          set -eu
          python -m pip install nbconvert ipykernel
          # Same neutral directory, same reason. GitHub renders the committed
          # outputs, so executing them here keeps the notebook honest.
          work="$RUNNER_TEMP/wheel-check"
          cp py/notebooks/quickstart.ipynb "$work/"
          cd "$work"
          jupyter nbconvert --execute --to notebook --stdout quickstart.ipynb > /dev/null

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      # checkVGraph compiles tools/vgraph.nim, which imports contracts (its
      # layerOf/layerOfModule postconditions) -- needs deps resolved first.
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - run: $GATE lint
      - run: $GATE checkVGraph

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - run: $GATE docsDeps
      # nimib runs the book's code against this build: a stale book fails here.
      - run: $GATE docs
      - name: Upload Docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: pages/

  pages:
    name: Publish Pages
    needs: docs
    # Pages serves private repos only on a paid plan. Skipped when this repo is
    # private; switches itself on for a public one.
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow default outright, so the
      # checkout/artifact read has to be restated alongside the Pages grants.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v5

  coverage:
    name: Coverage
    # Linux only: Apple's gcov is a clang stub emitting no .gcda, so the report
    # would come out empty on macOS. No lcov version pin needed — the task
    # suppresses no error, so 1.x and 2.x agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: sudo apt-get update && sudo apt-get install -y lcov
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - run: $GATE coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: |
            coverage/
            lcov.info

  canary:
    name: Canary (the gate must fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - name: Build the failure gate
        run: nim c --hints:off -o:build/unigate tools/gate.nim
      - name: A broken build must come back non-zero
        run: |
          # `nimble canary` compiles a source that cannot compile. Nimble
          # reports success for it; the gate is the only thing that does not.
          # If this step ever passes, every green result in this run is void.
          if ./build/unigate canary; then
            echo "canary: the gate let a broken build through" >&2
            exit 1
          fi
          echo "canary: the gate rejected a broken build, as it must"

  all-green:
    name: All green
    # The one check branch protection requires, and the only name that has to
    # stay stable. `skipped` passes: `dco` runs on pull requests only, and
    # `pages` only on main.
    needs: [dco, spdx, test, cabi, python, consume-cabi, consume-wheel, lint, docs, pages, coverage, canary]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for one in $results; do
            case "$one" in
              success) ;;
              skipped) ;;
              *) echo "all-green: a required job reported $one" >&2; exit 1 ;;
            esac
          done
